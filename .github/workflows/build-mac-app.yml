name: Build app per macOS

# Costruisce "Unconditional Surrender.app" su un runner Apple Silicon e la
# rende scaricabile. Due modi per lanciarla:
#   • a mano, dalla tab Actions → "Run workflow" (l'app finisce fra gli artifact)
#   • pubblicando un tag "v*" (l'app viene allegata a una Release)
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # macos-14 è Apple Silicon: serve perché il launcher nativo committato nel
    # repo (packages/electron/launcher) è un binario arm64.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepara yarn
        # Il repo dichiara packageManager yarn@1.22.22, quindi Corepack usa la
        # versione giusta. Sui runner macOS yarn è comunque preinstallato: se
        # corepack non è disponibile si prosegue con quello.
        run: |
          corepack enable || echo "corepack non disponibile, uso yarn di sistema"
          yarn --version

      - name: Installa dipendenze
        run: yarn install --frozen-lockfile

      - name: Test del motore di gioco
        run: yarn workspace @uswc/shared test

      - name: Costruisci l'app
        run: yarn electron:build

      - name: Firma ad-hoc del bundle
        # Senza alcuna firma, un'app scaricata dal browser viene dichiarata da
        # macOS "danneggiata e non può essere aperta", e il click destro → Apri
        # non basta. Una firma ad-hoc (--sign -) non richiede un certificato
        # Apple ma rende il bundle coerente, così Gatekeeper si limita a
        # chiedere conferma. Va applicata dopo l'assemblaggio, dall'interno
        # verso l'esterno: prima Electron annidato, poi il bundle esterno.
        run: |
          APP="packages/electron/release/mac-arm64/Unconditional Surrender.app"
          codesign --force --deep --sign - "$APP/Contents/Resources/Electron.app"
          codesign --force --sign - "$APP/Contents/MacOS/Unconditional Surrender"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"

      - name: Comprimi l'app
        # ditto è il modo corretto di zippare un .app su macOS: preserva
        # symlink e permessi, che un normale zip rovinerebbe.
        run: |
          cd "packages/electron/release/mac-arm64"
          ditto -c -k --sequesterRsrc --keepParent \
            "Unconditional Surrender.app" \
            "$GITHUB_WORKSPACE/UnconditionalSurrender-macOS-arm64.zip"

      - name: Pubblica come artifact scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: UnconditionalSurrender-macOS-arm64
          path: UnconditionalSurrender-macOS-arm64.zip
          if-no-files-found: error

      - name: Allega alla Release (solo sui tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: UnconditionalSurrender-macOS-arm64.zip
          body: |
            App per macOS (Apple Silicon).

            **Come aprirla la prima volta.** L'app ha solo una firma ad-hoc, non
            un certificato Apple, quindi macOS al primo avvio chiede conferma.
            Scompatta lo zip e fai click destro sull'app → *Apri* → *Apri*.

            Se compare "è danneggiato e non può essere aperto", è l'attributo di
            quarantena messo dal browser: toglilo da Terminale e riprova.
            Scrivi il comando seguente **con lo spazio finale**, poi trascina
            l'app nella finestra del Terminale e premi Invio.

            ```
            xattr -dr com.apple.quarantine
            ```

            Richiede macOS 12 o successivo su Mac con chip Apple.
